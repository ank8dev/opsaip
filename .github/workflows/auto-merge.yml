name: auto-merge

# Runs after security-gate finishes. workflow_run always uses THIS file as
# it is on the default branch, so a PR cannot change it.
# It does not merge. It only turns GitHub auto-merge (squash) on or off.
# GitHub merges when the required checks (the ci jobs) are green.
on:
  workflow_run:
    workflows: [security-gate]
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    name: auto-merge
    # Same-repo PRs only: fork PRs have a different head repository.
    if: >-
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by GitHub to enable auto-merge
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      GATE_RESULT: ${{ github.event.workflow_run.conclusion }}
      GATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Enable or disable auto-merge
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then echo "No PR linked to this run; nothing to do."; exit 0; fi

          pr=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,isDraft,isCrossRepository,headRefOid)
          [ "$(jq -r .state <<<"$pr")" = "OPEN" ] || { echo "PR not open; skipping."; exit 0; }
          [ "$(jq -r .isCrossRepository <<<"$pr")" = "false" ] || { echo "Fork PR; skipping."; exit 0; }
          # The gate result must be for the commit that is the PR head now.
          [ "$(jq -r .headRefOid <<<"$pr")" = "$GATE_SHA" ] || { echo "Gate result is for an older commit; skipping."; exit 0; }

          if [ "$GATE_RESULT" = "success" ]; then
            [ "$(jq -r .isDraft <<<"$pr")" = "false" ] || { echo "Draft PR; skipping."; exit 0; }
            gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash
            echo "Auto-merge (squash) enabled for #$PR_NUMBER."
          elif [ "$GATE_RESULT" = "failure" ]; then
            gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto || true
            echo "Gate failed: auto-merge off for #$PR_NUMBER. Needs the founder."
          else
            echo "Gate result '$GATE_RESULT'; leaving auto-merge unchanged."
          fi
